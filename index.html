<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="נשימת קופסה">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1014">
<title>נשימת קופסה</title>
<style>
  :root{
    --bg:      oklch(0.17 0.014 250);
    --surface: oklch(0.215 0.016 250);
    --line:    oklch(0.32 0.014 250);
    --ink:     oklch(0.96 0.006 250);
    --muted:   oklch(0.68 0.012 250);
    --accent:  oklch(0.78 0.075 195);
    --idle:    oklch(0.42 0.02 250);
    --r: 18px;
    --step: 4px;
  }
  html[data-theme="light"]{
    --bg:      oklch(0.975 0.004 250);
    --surface: oklch(1 0 0);
    --line:    oklch(0.88 0.008 250);
    --ink:     oklch(0.22 0.012 250);
    --muted:   oklch(0.52 0.01 250);
    --accent:  oklch(0.58 0.095 195);
    --idle:    oklch(0.86 0.012 250);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:400 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Hebrew", "Heebo", "Segoe UI", system-ui, sans-serif;
    display:grid; grid-template-rows:auto 1fr auto;
    padding:max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    overscroll-behavior:none; transition:background .4s ease;
  }

  /* ---------- header ---------- */
  header{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:40px}
  .stat{display:flex; gap:18px; font-size:13px; color:var(--muted)}
  .stat b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
  .tools{display:flex; gap:6px}
  button{
    font:inherit; color:var(--ink); background:transparent; border:1px solid var(--line);
    border-radius:10px; padding:8px 12px; min-height:40px; cursor:pointer;
    transition:border-color .15s, background .15s, opacity .15s;
  }
  button:hover{border-color:var(--muted)}
  button.on{border-color:var(--accent); color:var(--accent)}
  button.icon{min-width:40px; padding:8px}

  /* ---------- stage ---------- */
  main{display:grid; place-items:center; min-height:0; padding:8px 0}
  .stage{position:relative; width:min(78vmin, 460px); aspect-ratio:1}
  svg{width:100%; height:100%; display:block; overflow:visible}
  .track{fill:none; stroke:var(--line); stroke-width:3; opacity:.55}
  .pen{fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round}
  html[data-state="idle"] .pen{opacity:0}
  html[data-state="hold"] .pen{stroke:var(--muted)}
  .glow{fill:var(--accent); opacity:.05}
  html[data-state="idle"] .glow{opacity:.03}

  .readout{
    position:absolute; inset:0; display:grid; place-content:center; gap:6px;
    text-align:center; pointer-events:none;
  }
  .phase{font-size:clamp(20px,5.4vw,30px); font-weight:600; letter-spacing:.01em}
  .secs{font-size:clamp(64px,20vw,116px); font-weight:200; line-height:.95;
        font-variant-numeric:tabular-nums; letter-spacing:-.03em}
  html[data-state="idle"] .secs{opacity:.28}
  .cycle{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  .hint{font-size:13px; color:var(--muted)}

  /* ---------- footer ---------- */
  footer{display:grid; gap:10px}
  .phases{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
  .chip{
    border:1px solid var(--line); border-radius:999px; padding:7px 14px;
    font-size:14px; background:transparent; color:var(--muted); min-height:40px;
  }
  .chip[aria-pressed="true"]{border-color:var(--accent); color:var(--accent)}
  .panel{
    display:none; gap:14px; padding:14px; border:1px solid var(--line);
    border-radius:var(--r); background:var(--surface);
  }
  .panel.open{display:grid}
  .row{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .row label{font-size:14px; color:var(--muted)}
  .stepper{display:flex; align-items:center; gap:4px}
  .stepper output{min-width:34px; text-align:center; font-variant-numeric:tabular-nums}
  .stepper button{min-width:40px; min-height:40px; padding:0; font-size:18px}
  .play{
    background:var(--accent); color:oklch(0.18 0.02 250); border:none;
    font-weight:600; padding:14px 20px; border-radius:14px; min-height:52px; width:100%;
  }
  .play:hover{filter:brightness(1.06)}
  .foot-note{font-size:12px; color:var(--muted); text-align:center}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body data-state="idle">

<header>
  <div class="stat">
    <span>סבבים היום <b id="sToday">0</b></span>
    <span>סה״כ <b id="sTotal">0</b></span>
  </div>
  <div class="tools">
    <button class="icon" id="bSound" title="צליל">♪</button>
    <button class="icon" id="bTheme" title="מצב תצוגה">◐</button>
    <button class="icon" id="bSettings" title="הגדרות">⋯</button>
  </div>
</header>

<main>
  <div class="stage" id="stage" role="button" tabindex="0" aria-label="התחל או עצור">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <path class="glow" id="glow" d=""/>
      <path class="track" id="track" d=""/>
      <path class="pen" id="pen" d=""/>
    </svg>
    <div class="readout">
      <div class="phase" id="phase">מוכן?</div>
      <div class="secs" id="secs">4</div>
      <div class="cycle" id="cycle"></div>
      <div class="hint" id="hint">הקש על הריבוע כדי להתחיל</div>
    </div>
  </div>
</main>

<footer>
  <div class="phases" id="presets">
    <button class="chip" data-p="4,4,4,4" aria-pressed="true">4·4·4·4</button>
    <button class="chip" data-p="5,5,5,5" aria-pressed="false">5·5·5·5</button>
    <button class="chip" data-p="6,2,6,2" aria-pressed="false">6·2·6·2</button>
    <button class="chip" data-p="4,7,8,0" aria-pressed="false">4·7·8</button>
  </div>

  <div class="panel" id="panel">
    <div class="row"><label>שאיפה</label>
      <div class="stepper"><button data-k="0" data-d="-1">−</button><output id="v0">4</output><button data-k="0" data-d="1">+</button></div></div>
    <div class="row"><label>החזקה</label>
      <div class="stepper"><button data-k="1" data-d="-1">−</button><output id="v1">4</output><button data-k="1" data-d="1">+</button></div></div>
    <div class="row"><label>נשיפה</label>
      <div class="stepper"><button data-k="2" data-d="-1">−</button><output id="v2">4</output><button data-k="2" data-d="1">+</button></div></div>
    <div class="row"><label>החזקה בסוף</label>
      <div class="stepper"><button data-k="3" data-d="-1">−</button><output id="v3">4</output><button data-k="3" data-d="1">+</button></div></div>
    <div class="row"><label>עצור אחרי</label>
      <div class="stepper"><button data-k="4" data-d="-1">−</button><output id="v4">∞</output><button data-k="4" data-d="1">+</button></div></div>
  </div>

  <button class="play" id="play">התחל</button>
  <div class="foot-note">נשימת קופסה — 4 שניות שאיפה, החזקה, נשיפה, החזקה · עובד גם בלי אינטרנט</div>
</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const S = { phases:[4,4,4,4], maxCycles:0, sound:true, theme:"auto" };
  const KEY = "boxbreath.v1";
  const LABELS = ["שאיפה","החזקה","נשיפה","החזקה"];

  /* ---------- persistence ---------- */
  const stats = {today:0, total:0, day:new Date().toDateString()};
  try {
    const raw = JSON.parse(localStorage.getItem(KEY) || "{}");
    Object.assign(S, raw.s || {});
    if (raw.stats) Object.assign(stats, raw.stats);
    if (stats.day !== new Date().toDateString()) { stats.day = new Date().toDateString(); stats.today = 0; }
  } catch {}
  const save = () => {
    stats.day = new Date().toDateString();
    try { localStorage.setItem(KEY, JSON.stringify({s:S, stats})); } catch {}
    $("sToday").textContent = stats.today;
    $("sTotal").textContent = stats.total;
  };

  /* ---------- geometry: a rounded square, one side per phase ---------- */
  const IN = 34, SIZE = 300, R = 40;
  const L = IN, T = IN, Rt = SIZE - IN, B = SIZE - IN;
  const d = `M ${L+R} ${T} H ${Rt-R} A ${R} ${R} 0 0 1 ${Rt} ${T+R} V ${B-R} ` +
            `A ${R} ${R} 0 0 1 ${Rt-R} ${B} H ${L+R} A ${R} ${R} 0 0 1 ${L} ${B-R} ` +
            `V ${T+R} A ${R} ${R} 0 0 1 ${L+R} ${T} Z`;
  const track = $("track"), pen = $("pen"), glow = $("glow");
  track.setAttribute("d", d); pen.setAttribute("d", d); glow.setAttribute("d", d);
  const PER = pen.getTotalLength();
  pen.style.strokeDasharray = `${PER} ${PER}`;
  pen.style.strokeDashoffset = PER;

  /* ---------- theme ---------- */
  const mq = matchMedia("(prefers-color-scheme: light)");
  const applyTheme = () => {
    const light = S.theme === "auto" ? mq.matches : S.theme === "light";
    document.documentElement.dataset.theme = light ? "light" : "dark";
    document.querySelector('meta[name=theme-color]').content = light ? "#f7f8f9" : "#0d1014";
  };
  mq.addEventListener("change", applyTheme);

  /* ---------- audio: a soft second-tick + a phase tone ---------- */
  let ac = null;
  const beep = (f, dur, gain) => {
    if (!S.sound) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.value = gain; o.connect(g); g.connect(ac.destination);
      const t = ac.currentTime;
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.start(t); o.stop(t + dur + .02);
    } catch {}
  };
  const haptic = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch {} };

  /* ---------- the engine ---------- */
  let running = false, phaseIdx = 0, phaseStart = 0, cycle = 1, lastSec = -1, raf = 0;

  function paint(progress) {
    const total = S.phases.reduce((a,b)=>a+b,0);
    const done = S.phases.slice(0, phaseIdx).reduce((a,b)=>a+b,0) + progress * S.phases[phaseIdx];
    const p = total ? done / total : 0;
    pen.style.strokeDashoffset = PER * (1 - p);
    // the square itself breathes, very slightly
    const expand = phaseIdx === 0 ? progress : phaseIdx === 2 ? 1 - progress : (phaseIdx === 1 ? 1 : 0);
    const s = 1 + (expand - .5) * .06;
    $("stage").style.transform = `scale(${s.toFixed(4)})`;
  }

  function enterPhase(now) {
    phaseIdx = 0; cycle = 1; phaseStart = now; lastSec = -1;
    document.body.dataset.state = "run";
  }

  function tick(now) {
    if (!running) return;
    const dur = Math.max(.5, S.phases[phaseIdx]);
    const el = (now - phaseStart) / 1000;
    const progress = Math.min(1, el / dur);
    paint(progress);

    const left = Math.max(0, Math.ceil(dur - el));
    $("phase").textContent = LABELS[phaseIdx];
    $("secs").textContent = left || 0;
    $("cycle").textContent = S.maxCycles ? `סבב ${cycle} מתוך ${S.maxCycles}` : `סבב ${cycle}`;

    const secNow = Math.floor(el);
    if (secNow !== lastSec) {
      lastSec = secNow;
      if (secNow > 0) beep(phaseIdx === 0 ? 528 : phaseIdx === 2 ? 396 : 330, .05, .028);
      if (secNow === 0) { beep(phaseIdx === 2 ? 396 : phaseIdx === 1 ? 440 : 528, .12, .05); haptic(8); }
    }
    if (progress >= 1) {
      if (!nextPhase()) return;
      phaseStart = now; lastSec = -1;
    }
    raf = requestAnimationFrame(tick);
  }

  const setPhaseState = () => {
    document.body.dataset.state = (phaseIdx === 1 || phaseIdx === 3) ? "hold" : "run";
  };

  /** Advance the phase pointer, skipping zero-length phases. False → session done. */
  function nextPhase() {
    for (let guard = 0; guard < 12; guard++) {
      phaseIdx++;
      if (phaseIdx > 3) {
        phaseIdx = 0; cycle++;
        stats.today++; stats.total++; save();
        if (S.maxCycles && cycle > S.maxCycles) { stop(true); return false; }
      }
      if (S.phases[phaseIdx] > 0) { setPhaseState(); return true; }
    }
    stop(true); return false;   // all phases are zero — nothing to do
  }

  function start() {
    running = true; enterPhase(performance.now());
    setPhaseState();
    $("play").textContent = "השהה";
    $("hint").textContent = "";
    beep(528, .12, .05); haptic(8);
    raf = requestAnimationFrame(tick);
  }
  function stop(finished) {
    running = false; cancelAnimationFrame(raf);
    document.body.dataset.state = "idle";
    pen.style.strokeDashoffset = PER;
    $("stage").style.transform = "scale(1)";
    $("phase").textContent = finished ? "כל הכבוד" : "מושהה";
    $("secs").textContent = S.phases[0];
    $("cycle").textContent = "";
    $("hint").textContent = finished ? "הקש כדי להתחיל סבב חדש" : "הקש כדי להמשיך";
    $("play").textContent = finished ? "התחל" : "המשך";
    if (finished) { beep(660, .25, .06); haptic([12,60,12]); }
  }

  /* ---------- controls ---------- */
  $("stage").addEventListener("click", () => running ? stop(false) : start());
  $("stage").addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); running ? stop(false) : start(); } });
  $("play").addEventListener("click", () => running ? stop(false) : start());
  $("bSettings").addEventListener("click", () => $("panel").classList.toggle("open"));
  $("bSound").addEventListener("click", e => { S.sound = !S.sound; e.currentTarget.classList.toggle("on", S.sound); save(); });
  $("bTheme").addEventListener("click", () => {
    S.theme = S.theme === "auto" ? "dark" : S.theme === "dark" ? "light" : "auto";
    applyTheme(); save();
  });

  $("presets").addEventListener("click", e => {
    const b = e.currentTarget.querySelectorAll(".chip");
    const btn = e.target.closest(".chip"); if (!btn) return;
    const p = btn.dataset.p.split(",").map(Number);
    S.phases = p; S.maxCycles = 0;
    b.forEach(x => x.setAttribute("aria-pressed", String(x === btn)));
    [0,1,2,3].forEach(i => { if ($("v"+i)) $("v"+i).textContent = S.phases[i] || 0; });
    if (running) stop(false);
    $("secs").textContent = S.phases[0];
    save();
  });

  $("panel").addEventListener("click", e => {
    const b = e.target.closest("button[data-k]"); if (!b) return;
    const k = +b.dataset.k, dd = +b.dataset.d;
    if (k === 4) {
      const seq = [0,1,3,5,8,10,15,20];
      let i = seq.indexOf(S.maxCycles); i = Math.max(0, i === -1 ? 0 : i + dd);
      S.maxCycles = seq[Math.min(seq.length-1, Math.max(0, i))];
      $("v4").textContent = S.maxCycles || "∞";
    } else {
      S.phases[k] = Math.min(20, Math.max(0, (S.phases[k]||0) + dd));
      $("v"+k).textContent = S.phases[k];
      document.querySelectorAll("#presets .chip").forEach(c => c.setAttribute("aria-pressed","false"));
    }
    if (running) stop(false);
    $("secs").textContent = S.phases[0];
    save();
  });

  /* ---------- boot ---------- */
  applyTheme();
  if (!S.sound) $("bSound").classList.remove("on"); else $("bSound").classList.add("on");
  [0,1,2,3].forEach(i => { $("v"+i).textContent = S.phases[i]; });
  $("v4").textContent = S.maxCycles || "∞";
  $("secs").textContent = S.phases[0];
  $("sToday").textContent = stats.today;
  $("sTotal").textContent = stats.total;
  paint(0);
  document.addEventListener("visibilitychange", () => { if (document.hidden && running) stop(false); });
})();
</script>
</body>
</html>
